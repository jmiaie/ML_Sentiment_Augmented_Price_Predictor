<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Minimum detectable log-loss improvement vs number of filing events</title>
<desc id="d">Analytic MDE at 80% power and 5% size, scaled as 1/sqrt(n) from the committed 2025 primary-target interval (n = 197), with Monte Carlo points from the production block bootstrap.</desc>
<rect width="720" height="440" fill="#fcfcfb"/>
<text x="80" y="24" font-size="15" font-weight="600" fill="#0b0b0b">Smallest log-loss improvement detectable with 80% power</text>
<text x="80" y="42" font-size="12" fill="#52514e">Combined minus market-only, primary target; nats per filing event (log scale)</text>
<line x1="80" x2="550" y1="353.8" y2="353.8" stroke="#e4e3df" stroke-width="1"/>
<text x="72" y="357.8" font-size="11" fill="#52514e" text-anchor="end">0.001</text>
<line x1="80" x2="550" y1="284.9" y2="284.9" stroke="#e4e3df" stroke-width="1"/>
<text x="72" y="288.9" font-size="11" fill="#52514e" text-anchor="end">0.002</text>
<line x1="80" x2="550" y1="193.8" y2="193.8" stroke="#e4e3df" stroke-width="1"/>
<text x="72" y="197.8" font-size="11" fill="#52514e" text-anchor="end">0.005</text>
<line x1="80" x2="550" y1="124.9" y2="124.9" stroke="#e4e3df" stroke-width="1"/>
<text x="72" y="128.9" font-size="11" fill="#52514e" text-anchor="end">0.01</text>
<line x1="80" x2="550" y1="56.0" y2="56.0" stroke="#e4e3df" stroke-width="1"/>
<text x="72" y="60.0" font-size="11" fill="#52514e" text-anchor="end">0.02</text>
<text x="104.2" y="394" font-size="11" fill="#52514e" text-anchor="middle">197</text>
<text x="186.8" y="394" font-size="11" fill="#52514e" text-anchor="middle">500</text>
<text x="248.3" y="394" font-size="11" fill="#52514e" text-anchor="middle">1,000</text>
<text x="391.1" y="394" font-size="11" fill="#52514e" text-anchor="middle">5,000</text>
<text x="514.0" y="394" font-size="11" fill="#52514e" text-anchor="middle">20,000</text>
<line x1="80" x2="550" y1="376" y2="376" stroke="#52514e" stroke-width="1"/>
<text x="315.0" y="422" font-size="12" fill="#52514e" text-anchor="middle">Evaluation filing events, n (log scale)</text>
<line x1="80" x2="550" y1="161.6" y2="161.6" stroke="#52514e" stroke-width="1" stroke-dasharray="4 4"/>
<text x="558" y="165.6" font-size="11" fill="#52514e">1% of baseline log loss</text>
<polyline points="104.2,113.8 186.8,160.1 248.3,194.6 391.1,274.6 514.0,343.5" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/>
<circle cx="104.2" cy="113.8" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>n = 197: analytic MDE80 = 0.0112 nats</title></circle>
<circle cx="186.8" cy="160.1" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>n = 500: analytic MDE80 = 0.0070 nats</title></circle>
<circle cx="248.3" cy="194.6" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>n = 1,000: analytic MDE80 = 0.0050 nats</title></circle>
<circle cx="391.1" cy="274.6" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>n = 5,000: analytic MDE80 = 0.0022 nats</title></circle>
<circle cx="514.0" cy="343.5" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>n = 20,000: analytic MDE80 = 0.0011 nats</title></circle>
<rect x="99.2" y="108.7" width="10" height="10" fill="#eb6834" stroke="#fcfcfb" stroke-width="2" transform="rotate(45 104.2 113.7)"><title>n = 197: simulated MDE80 = 0.0112 nats (R = 2000)</title></rect>
<rect x="181.8" y="154.8" width="10" height="10" fill="#eb6834" stroke="#fcfcfb" stroke-width="2" transform="rotate(45 186.8 159.8)"><title>n = 500: simulated MDE80 = 0.0070 nats (R = 1000)</title></rect>
<rect x="243.3" y="191.6" width="10" height="10" fill="#eb6834" stroke="#fcfcfb" stroke-width="2" transform="rotate(45 248.3 196.6)"><title>n = 1,000: simulated MDE80 = 0.0049 nats (R = 1000)</title></rect>
<text x="524.0" y="347.5" font-size="11" fill="#0b0b0b">Analytic (1/sqrt n)</text>
<line x1="558" x2="576" y1="64" y2="64" stroke="#2a78d6" stroke-width="2"/>
<circle cx="567" cy="64" r="4" fill="#2a78d6"/>
<text x="582" y="68" font-size="11" fill="#0b0b0b">Analytic</text>
<rect x="562" y="79" width="10" height="10" fill="#eb6834" transform="rotate(45 567 84)"/>
<text x="582" y="88" font-size="11" fill="#0b0b0b">Simulated (production</text>
<text x="582" y="102" font-size="11" fill="#0b0b0b">bootstrap)</text>
<text x="114.2" y="103.8" font-size="11" fill="#0b0b0b">n = 197: 0.0112</text>
</svg>
