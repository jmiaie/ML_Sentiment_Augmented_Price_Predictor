  basis: >
    Formation (2015-2023) + validation (2024) completed under pre-registered D5
    walk-forward defaults. No hyperparameter search beyond C in {0.1,1.0,10.0}
    on formation folds. Primary symbol AAPL; lexicon sentiment_d9_financial_polarity_v1;
    dataset edgar_8k_yf_megacap_daily_2015_2025_v1 unchanged. No 2025 access before freeze.

notes: >
