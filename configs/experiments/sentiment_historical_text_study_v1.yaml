experiment_id: sentiment_hist_text_v1
status: frozen-for-holdout
directive: 9
dataset_id: edgar_8k_yf_megacap_daily_2015_2025_v1
primary_symbol: AAPL
seed: 7

universe:
  symbols: [AAPL, MSFT, AMZN]
  forms: [8-K]
  interval: 1d
  description: >
    Reproducible megacap subset. SEC EDGAR 8-K primary documents + yfinance
    daily prices. Not full EDGAR corpus.

periods:
