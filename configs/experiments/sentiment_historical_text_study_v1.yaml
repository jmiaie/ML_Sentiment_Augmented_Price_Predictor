target_column: next_session_direction

walk_forward:
  initial_train_size: 60
  validation_size: 20
  formation_internal_test_size: 20
  step_size: 20
  label_horizon: 1
  embargo: 0
  c_values: [0.1, 1.0, 10.0]

ablations:
  - majority_baseline
  - market_only_logistic
  - sentiment_only_logistic
  - combined_logistic

