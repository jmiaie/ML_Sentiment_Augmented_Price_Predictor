      inconsistency flagged to the owner for a wording-only correction; no methodology,
      universe, feature, target, horizon, embargo, grid or model definition was altered.

notes: >
  This is not a claim that point-in-time text adds predictive value --
  it is a reproducible, pre-registered test of whether it does, using
  real academic Loughran-McDonald categories (not a fabricated lexicon),
  a real NYSE calendar, and excess-return-over-SPY targets. If Model 3
  does not materially improve over Model 1, the required report says so
  explicitly rather than searching for a favorable cut of the data.
