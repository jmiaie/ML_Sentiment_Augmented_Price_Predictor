  - utc: "2026-09-18T01:30:42Z"
    event: pre-2025 evidence reviewed and ACCEPTED; final C frozen (status pre-registered -> frozen-final)
    note: >
      Independent review of the pre-2025 empirical evidence returned P0=0 / P1=0 and
      ACCEPTED it: EVIDENCE COMMIT aa176ddac213996a80768a538dc1afe000846609, PRODUCING
      CODE e55cb09e8367053c24270743e8b8d96f5fe1e375. Reviewed: the real DEV internal OOS
