  - utc: "2026-09-17T20:46:08Z"
    event: both authoritative input datasets frozen (VALIDATED -> DATA FROZEN)
    note: >
      APPENDED, not a rewrite: the entry above was true when written and stays.
      scripts/freeze_d9d_snapshot.py flipped BOTH dataset manifests to DATA
      FROZEN at 2026-09-17T20:46:08Z (committed as 869db904...) -- byte
      preserving, zero network access, recording the 13 per-file price CSV
      hashes and both canonical dataset hashes (filings 3b294187...; prices
      6ca6e433...). Independent post-freeze review PASSED on that commit. The
      frozen pair is now immutable input evidence: no re-freeze, no further
