# Sentiment/textual-signal historical validation (D9-D) — AUTHORITATIVE v2
# Status: FROZEN-FINAL.
#
# The methodology was pre-registered from Directive #9 before the authoritative
# v2 empirical runs. DEV internal OOS and 2024 validation are complete and
# independently reviewed. The final per-target C values were selected from the
# pre-specified 2024 validation grid and frozen before the single 2025
# historical evaluation.
#
# The FINAL CONFIGURATION is now frozen. The 2025 period remains labeled
# PREVIOUSLY INSPECTED / HISTORICAL EVALUATION because AAPL/MSFT/AMZN 2025
# outcomes had already been inspected under the preserved non-conforming v1
# study. No authoritative v2 2025 evaluation has yet been executed.
#
# Supersedes sentiment_historical_text_study_v1.yaml, which Directive #9 itself
# labels EXPLORATORY / NON-CONFORMING TO FINAL D9-D (3 issuers, 8-K only,
# non-LM embedded lexicon, day-level sample unit with manufactured non-event
# days, raw rather than excess-return targets, no proper NYSE calendar). v1
# remains preserved, unmodified, for audit trail; none of its numbers are
# reused here.
#
# Methodology here (universe, features, targets, models, C grid, embargo) is
# taken directly from Directive #9's own D9-D spec text -- none of it was
# derived from or tuned against any observed result, so the METHODOLOGY was
# PRE-REGISTERED before the authoritative v2 empirical runs. (The earlier
# "frozen on creation" wording was wrong and is corrected: pre-registration is
# not a freeze.) The FINAL CONFIGURATION is now FROZEN: the per-target final C
# values were written into walk_forward.final_selected_c from the reviewed
# pre-2025 selection, immediately before the single 2025 historical
# evaluation. See "CHRONOLOGY" and status_history below.
#
# EXECUTION STATUS (2026-09-17, MEASURED -- supersedes the earlier "corpus has
# NOT been acquired / egress proxy blocks SEC" note, which was a session-local
# proxy artifact, not an environment fact): the 12-issuer SEC EDGAR 10-K/10-Q/8-K
# corpus IS acquired -- 2,349 filings, 12/12 issuers, zero acquisition failures,
# UNCAPPED text (max 1,565,337 chars; 0 files at the legacy 200,000-char
# boundary). Both authoritative input datasets are FROZEN: the filings and
# prices manifests are status DATA FROZEN with freeze_timestamp_utc
# 2026-09-17T20:46:08Z, frozen by scripts/freeze_d9d_snapshot.py under commit
# 869db9048fd938080669894358aa84bf7d30e557 (filings canonical
# 3b2941870391b8584afaad46417cf3e6a0fe03509238fc6ac21958bb4c90f7f4, prices
# canonical 6ca6e433983fb5f629d084d0964229d5b9c91cbee0756f686598bea6c90d4cb2).
# That frozen pair is immutable input evidence. Code + tests pass on synthetic
# fixtures, and the dedicated authoritative runner
# scripts/run_historical_text_study_v2.py is fixture-tested end to end without
# network access.
#
# CHRONOLOGY (corrected 2026-09-17 -- the earlier freeze record was premature
# and is removed; it asserted a methodology freeze while no pre-2025 evidence
# existed, inverting the required order):
#   pre-register (this file) -> acquire + freeze corpus -> DEV ->
#   2024 validation -> select final C -> write final_selected_c here ->
#   freeze config -> gate 2025 exactly once as HISTORICAL EVALUATION.
# Every step through "freeze config" is DONE (final freeze commit
# 852761753af2aa72abf477fc3961629c5a496d17, parent
# aa176ddac213996a80768a538dc1afe000846609); the 2025 gate is the only
# remaining step and has NOT been executed.
#
# IMPORTANT HOLDOUT CLASSIFICATION (per Directive #9's own D9-D spec text):
# the existing v1 study already inspected 2025 outcomes for AAPL/MSFT/AMZN,
# which are part of this authoritative 12-issuer universe. The conforming
# D9-D 2025 period is therefore `PREVIOUSLY INSPECTED / HISTORICAL EVALUATION`,
# never an untouched final holdout. The remaining nine issuers are NOT to be
# isolated and called a new untouched confirmatory sample. Do not shift to
# 2026 (reserved program-wide).

experiment_id: sentiment_hist_text_v2
status: frozen-final
directive: 9
dataset_ids:
  filings: sec_filings_12issuer_2015_2025_v1
  prices: yf_sentiment_equities_daily_2015_2025_v1
  dictionary: lm_master_dictionary_2026_v1
seed: 0

universe:
  symbols: [AAPL, MSFT, AMZN, GOOGL, NVDA, JPM, XOM, JNJ, PG, WMT, HD, KO]
  market_context_symbol: SPY
  forms: [10-K, 10-Q, 8-K]
  description: >
    Exactly the 12 issuers named in Directive #9's D9-D spec text, plus SPY
    for market context. This is a static, present-day-selected universe of
    large, currently-listed issuers -- it carries survivorship/selection
    bias (no delisted, merged, or historically-relevant-but-no-longer-
    prominent issuers), disclosed explicitly, not hidden.

periods:
  requested_data_start: "2015-01-01"
  requested_data_end_exclusive: "2026-01-01"
  formation_dev: {start: "2015-01-01", end_inclusive: "2023-12-31"}
  validation: {start: "2024-01-01", end_inclusive: "2024-12-31"}
  historical_evaluation: {start: "2025-01-01", end_inclusive: "2025-12-31"}
  historical_evaluation_label: "PREVIOUSLY INSPECTED / HISTORICAL EVALUATION"
  historical_evaluation_label_note: >
    AAPL/MSFT/AMZN 2025 outcomes were already inspected under v1
    (sentiment_hist_text_v1_holdout_2025). Not an untouched final holdout.
    Not shifted to 2026 (reserved program-wide).

sample_unit: event_level_filing_observation
sample_unit_note: >
  One row per unique (CIK, accession) filing. No manufactured
  zero-sentiment non-event days.

point_in_time:
  field: acceptance_datetime (SEC EDGAR acceptanceDateTime)
  never: filing_date or reportDate alone
  decision_cutoff: nyse_regular_session_close
  routing_rule: >
    Published before that session's real close (16:00 ET normal day, the
    actual early-close time on a half day): available as of that session's
    own close. Published at/after close, weekend, or holiday: advance to
    the next valid NYSE session. Calendar: pandas_market_calendars NYSE
    (real holidays + early closes + time zones -- not a weekday-only
    calendar).

text_features:
  dictionary: real Loughran-McDonald Master Dictionary via the pysentiment2
    PyPI package (not vendored/committed in this repo, per the spec's "do
    not redistribute the full dictionary unless permitted")
  categories: [negative_fraction, positive_fraction, uncertainty_fraction,
               litigious_fraction, constraining_fraction, net_tone, log_word_count]
  finbert_is_not_confirmatory: true

market_features:
  trailing_only: true
  no_future_leakage: true
  columns: [issuer_return_1d, issuer_return_5d, issuer_return_20d,
            issuer_realized_vol_20d, issuer_realized_vol_60d,
            issuer_volume_zscore_20d, spy_return_1d, spy_return_5d,
            spy_return_20d, spy_realized_vol_20d]

targets:
  primary:
    name: next_session_excess_return_direction
    horizon_sessions: 1
    embargo_sessions: 1
    definition: (issuer close-to-close return) - (SPY close-to-close return) > 0
  secondary:
    name: five_session_forward_excess_return_direction
    horizon_sessions: 5
    embargo_sessions: 5
    definition: same excess-return construction, 5-session horizon

walk_forward:
  method: purged_session_distance_embargoed
  method_note: >
    Not a row-count gap -- multi-issuer event rows are pooled and can share
    a session or be many sessions apart, so a row-count gap does not
    reliably correspond to a session-count embargo. Purges by actual NYSE
    session distance instead (Lopez de Prado-style purged/embargoed CV).
  initial_train_size: 60
  validation_size: 20
  formation_internal_test_size: 20
  step_size: 20
  c_values: [0.01, 0.1, 1.0, 10.0]
  # Pre-2025-selected final C, PER TARGET, one entry per model, written here
  # ONLY after DEV + 2024 validation have been reviewed. Each target carries its
  # own dictionary because the 1-session and 5-session targets have different
  # horizons and embargoes and their C is selected independently -- one shared
  # dictionary would silently apply the primary target's C to the secondary.
  # The 2025 historical evaluation refuses to start unless every logistic model
  # has a value for BOTH targets, and never re-selects C on 2025 data
  # (constraints.no_retune_after_freeze). model0 is the majority/unconditional
  # baseline and has no C. null = not yet selected.
  # Null until a reviewed DEV + 2024 selection has run. Populate with the block
  # printed by `scripts/run_historical_text_study_v2.py --select-final-c`, which
  # selects on purged-formation train -> 2024 validation ONLY (never 2025) and
  # is frozen before the 2025 HISTORICAL EVALUATION reads it verbatim. A target
  # is usable only once all three logistic models carry a selected value;
  # model0_majority_baseline is the baseline and is always null.
  #
  # What --select-final-c does and does NOT produce (clarified -- the earlier
  # wording "runs no period study" was misleading): it writes NO ordinary
  # DEV / 2024-validation / 2025 period-study result artifacts (no
  # *_dev_formation.json, no *_val_2024.json, no *_holdout_2025.json, no
  # per-model period metrics). It DOES compute the pre-specified 2024 validation
  # log loss for all four C candidates, per model and per target, and report the
  # argmin -- that grid IS the model-selection evidence this file is populated
  # from, and it is pre-2025-only by construction.
  final_selected_c:
    primary:
      model0_majority_baseline: null
      model1_market_only: 0.01
      model2_text_only: 0.01
      model3_market_text_combined: 0.01
    secondary:
      model0_majority_baseline: null
      model1_market_only: 0.01
      model2_text_only: 0.01
      model3_market_text_combined: 0.01

confirmatory_models:
  model0_majority_baseline: unconditional majority-class baseline
  model1_market_only: logistic regression, market-only features
  model2_text_only: logistic regression, real LM text features only
  model3_market_text_combined: logistic regression, market + text features
  headline_comparison: model3_market_text_combined minus model1_market_only
  headline_metric_primary: log_loss
  headline_target: primary (1-session)
  secondary_target_role: pre-specified robustness check, not the headline
  required_metrics: [log_loss, brier_score, balanced_accuracy]
  reported_where_valid: [precision, recall, f1, roc_auc, calibration, sample_size]
  key_question: >
    Incremental value of text beyond market features -- not raw
    combined-model accuracy.

uncertainty:
  fold_distributions: true
  bootstrap: event_aware_block_bootstrap
  bootstrap_note: >
    Blocks of consecutive session-ordered rows resampled with replacement
    (not iid-per-row), preserving local temporal/event dependence.

exploratory_methods:
  finbert: exploratory_only_after_confirmatory_frozen_and_evaluated
  xgboost: exploratory_only_after_confirmatory_frozen_and_evaluated
  may_not_replace_unfavorable_confirmatory_result: true

economic_evaluation:
  role: secondary_only
  threshold_selection: validation_data_only_frozen_before_2025
  report: [turnover, costs]
  may_not_redefine_primary_predictive_hypothesis: true

required_report:
  path: research/historical-textual-signal-study.md
  title: "Does Point-in-Time Financial Text Add Incremental Predictive Information?"
  subtitle: "A Historical Walk-Forward Study of SEC Filing-Derived and Market Features"
  if_model3_does_not_materially_improve: state_so_explicitly_no_target_search

constraints:
  no_retune_after_freeze: true
  no_universe_change_after_dataset_freeze: true
  no_ci_network_fetch: true
  no_2026_use_yet: true

status_history:
  - utc: "2026-09-17T00:00:00Z"
    event: methodology authored from Directive #9's own D9-D spec text
    note: >
      Universe, features, targets, models, C grid and embargo all come from the
      spec text; none of it was derived from or tuned against any observed
      result.
  - utc: "2026-09-17T18:00:00Z"
    event: status corrected frozen-for-holdout -> pre-registered
    note: >
      The earlier freeze record was premature and has been removed: it asserted a
      methodology freeze while no pre-2025 evidence existed yet, inverting the
      required chronology. No v2 2025 result exists and none was produced.
  - utc: "2026-09-17T20:30:00Z"
    event: final_selected_c restructured to per-target; corpus freeze made zero-network
    note: >
      Independent review required three corrections before the data-freeze gate.
      (1) Freezing is now a separate zero-network operation
      (scripts/freeze_d9d_snapshot.py) that verifies and flips the existing local
      bytes instead of re-downloading; the acquisition script's own freeze path is
