[build-system]
requires = ["setuptools>=78.1.1", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-sentiment"
version = "0.1.0"
description = "Point-in-time sentiment incremental predictive value validation framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1.1",
  "pandas>=2.2.2",
  "scikit-learn>=1.5.2",
  "pandas-market-calendars>=4.4.1",
  "pysentiment2>=0.1.1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.2",
  "pytest>=8.3.3",
  "ruff>=0.6.9",
  "pyyaml>=6.0.2",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "yfinance>=0.2.31",
]
data = [
  "yfinance==1.7.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "pyyaml>=6.0.2",
]

[project.scripts]
quant-sentiment-synthetic-validation = "quant_sentiment.synthetic_validation:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
no_site_packages = true
